<body>
<div id="app">
  <header>
    <div class="stat"><small data-t="gems_label"></small><div id="gems"><div class="gem" data-gem="b"></div><span id="gemCount">0</span></div></div>
    <div class="title"><b data-t="game_title"></b><div id="levelTag"></div><div id="modeTag"></div></div>
    <button id="rankBtn"><small id="rankLabel"></small><b id="rankTop">–</b></button>
  </header>
  <div class="strip"><div class="row"><span id="lvText"></span><span id="comboTop"></span></div><div class="bar" id="lvBarWrap"><i id="lvBar"></i></div></div>
  <div class="strip" id="rivalStrip"><div class="row"><span id="rivalText"></span></div></div>
  <div id="boardWrap"><div id="board"></div><div id="popMsg"></div></div>
  <div id="tray"><div class="slot" data-i="0"></div><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div></div>
</div>

<div class="overlay" id="overOv" hidden><div class="card"><h2 id="overTitle"></h2><div id="overBody"></div><div id="overBtns"></div></div></div>

<div class="overlay" id="lbOv" hidden>
  <div class="card">
    <h2 data-t="lb_title"></h2>
    <div class="tabs"><button class="tab on" id="tabServer" data-t="tab_server"></button><button class="tab" id="tabLeague" data-t="tab_league"></button></div>
    <div id="lbInfo"></div>
    <ul id="lbList"></ul>
    <div class="lbMsg" id="lbMsg"></div>
    <button class="btn ghostbtn" id="rulesBtn" data-t="btn_rules"></button>
    <button class="btn ghostbtn" id="langBtn" data-t="btn_lang"></button>
    <button class="btn ghostbtn" id="renameBtn" data-t="btn_rename"></button>
    <button class="btn" id="closeLbBtn" data-t="close"></button>
  </div>
</div>

<div class="overlay" id="infoOv" hidden><div class="card"><h2 id="infoTitle"></h2><div id="infoBody"></div><div id="infoBtns"></div></div></div>

<div class="overlay" id="shareOv" hidden>
  <div class="card">
    <h2 data-t="share_title"></h2>
    <p id="shareBody"></p>
    <input class="link" id="shareLink" readonly>
    <button class="btn vs" id="copyBtn" data-t="share_copy"></button>
    <div class="err" id="copyMsg" style="color:var(--good)"></div>
    <button class="btn ghostbtn" id="shareClose" data-t="close"></button>
  </div>
</div>

<div class="overlay" id="adOv" hidden>
  <div class="card">
    <h2 id="adTitle"></h2>
    <div class="adbox"><b id="adSim"></b><span id="adCount">3</span></div>
    <p id="adDesc"></p>
    <button class="btn ghostbtn" id="adSkip" hidden data-t="close"></button>
  </div>
</div>

<div class="overlay" id="nameOv" hidden>
  <div class="card">
    <h2 data-t="name_title"></h2>
    <p data-t="name_body"></p>
    <input class="name" id="nameInput" maxlength="16" data-tph="name_ph" autocomplete="off">
    <div class="err" id="nameErr"></div>
    <button class="btn" id="saveNameBtn" data-t="save"></button>
    <button class="btn ghostbtn" id="skipNameBtn" data-t="later"></button>
  </div>
</div>
</body>
</html>
